
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Event Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px 15px;
            background: #f4f6fa;
            color: #263238;
        }

        .container {
            max-width: 950px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #1f3a5f;
            margin-bottom: 8px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        h2 {
            color: #1f3a5f;
            margin-top: 0;
        }

        form {
            display: grid;
            gap: 15px;
        }

        label {
            font-weight: bold;
            margin-bottom: -8px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd2dc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 12px 18px;
            background: #1f3a5f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #294d79;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .delete-button {
            background: #b23a3a;
        }

        .delete-button:hover {
            background: #8f2929;
        }

        .message {
            margin: 12px 0;
            font-size: 14px;
        }

        .success {
            color: #18834a;
        }

        .error {
            color: #c62828;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #e0e4eb;
            text-align: left;
        }

        th {
            background: #1f3a5f;
            color: white;
        }

        .empty-cell {
            text-align: center;
            color: #777;
        }

        footer {
            text-align: center;
            color: #777;
            margin-top: 25px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>Campus Event Registration</h1>
            <p>Register and participate in upcoming campus organization events.</p>
        </header>

        <!-- Registration Form -->
        <section class="card">

            <h2>Student Registration</h2>

            <form id="registration-form">

                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    maxlength="80"
                    required
                >

                <label for="section">Section</label>
                <input
                    type="text"
                    id="section"
                    placeholder="Example: BSIT 2A"
                    maxlength="20"
                    required
                >

                <label for="event">Select Event</label>
                <select id="event" required>
                    <option value="">Choose an event</option>
                    <option value="IT Week">IT Week</option>
                    <option value="Programming Seminar">Programming Seminar</option>
                    <option value="Tech Symposium">Tech Symposium</option>
                    <option value="Organization Acquaintance Party">
                        Organization Acquaintance Party
                    </option>
                </select>

                <button type="submit" id="submit-button">
                    Register Now
                </button>

            </form>

            <p id="form-message" class="message" aria-live="polite"></p>

        </section>

        <!-- Registration List -->
        <section class="card">

            <h2>Registered Students</h2>

            <button type="button" id="refresh-button">
                Refresh Registrations
            </button>

            <p id="list-message" class="message" aria-live="polite"></p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Full Name</th>
                            <th>Section</th>
                            <th>Event</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="registration-list">
                    </tbody>
                </table>
            </div>

        </section>

        <footer>
            IPT1 Portfolio Project | Campus Event Registration System
        </footer>

    </div>

    <script src="app.js"></script>

</body>
</html>
